<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Pappa di Aki 🐶</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --pending: #dc2626;
            --pending-bg: #fee2e2;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: var(--primary);
        }

        #current-date {
            font-size: 14px;
            color: #64748b;
            text-transform: capitalize;
        }

        .meal-card {
            background: #f1f5f9;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .meal-card.done {
            background: var(--success-bg);
            border-color: #bbf7d0;
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .meal-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-badge.pending {
            background: var(--pending-bg);
            color: var(--pending);
        }

        .status-badge.done {
            background: #d1fae5;
            color: var(--success);
        }

        .meal-info {
            font-size: 14px;
            color: #475569;
            margin-bottom: 12px;
            min-height: 20px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            width: 100%;
            margin-top: 4px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🐶 La Pappa di Aki</h1>
            <div id="current-date">Caricamento data...</div>
        </header>

        <!-- SEZIONE MATTINA -->
        <div class="meal-card" id="card-mattina">
            <div class="meal-header">
                <div class="meal-title">☀️ Mattina</div>
                <div class="status-badge pending" id="badge-mattina">Non mangiato</div>
            </div>
            <div class="meal-info" id="info-mattina">In attesa di pappa...</div>
            <div id="action-mattina">
                <div class="input-group">
                    <input type="text" id="nome-mattina" placeholder="Tuo nome (es. Matteo)">
                    <button class="btn-primary" onclick="registraPappa('mattina')">Ha mangiato!</button>
                </div>
            </div>
        </div>

        <!-- SEZIONE SERA -->
        <div class="meal-card" id="card-sera">
            <div class="meal-header">
                <div class="meal-title">🌙 Sera</div>
                <div class="status-badge pending" id="badge-sera">Non mangiato</div>
            </div>
            <div class="meal-info" id="info-sera">In attesa di pappa...</div>
            <div id="action-sera">
                <div class="input-group">
                    <input type="text" id="nome-sera" placeholder="Tuo nome (es. Matteo)">
                    <button class="btn-primary" onclick="registraPappa('sera')">Ha mangiato!</button>
                </div>
            </div>
        </div>

        <footer>Sistema condiviso famiglia 🐾</footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configurazione Firebase fornita
        const firebaseConfig = {
            apiKey: "AIzaSyBdugS2wehpsfJXl9msJE5-EMeL0qOS1zg",
            authDomain: "pappaaki-ae79b.firebaseapp.com",
            databaseURL: "https://pappaaki-ae79b-default-rtdb.firebaseio.com",
            projectId: "pappaaki-ae79b",
            storageBucket: "pappaaki-ae79b.firebasestorage.app",
            messagingSenderId: "91452819393",
            appId: "1:91452819393:web:9ddea62dadb8f64f26d140"
        };

        // Inizializza Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Mostra data odierna formattata in italiano
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const oggiStr = new Date().toLocaleDateString('it-IT', options);
        document.getElementById('current-date').innerText = oggiStr;

        // Chiave basata sulla data di oggi (es. "2026-11-04") per il reset automatico giornaliero
        const dataOdiernaKey = new Date().toISOString().split('T')[0];
        const dbRef = ref(db, 'giorni/' + dataOdiernaKey);

        // Ascolta i cambiamenti in tempo reale dal database
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val() || { mattina: { mangiato: false }, sera: { mangiato: false } };
            aggiornaInterfaccia(data);
        });

        // Funzione per registrare il pasto
        window.registraPappa = function(pastomomento) {
            const inputNome = document.getElementById(`nome-${pastomomento}`);
            let nomeUtente = inputNome.value.trim();
            
            if (!nomeUtente) {
                alert("Per favore, inserisci il tuo nome prima di registrare la pappa!");
                inputNome.focus();
                return;
            }

            // Salva nel database
            const pastoRef = ref(db, `giorni/${dataOdiernaKey}/${pastomomento}`);
            set(pastoRef, {
                mangiato: true,
                chi: nomeUtente,
                orario: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
            });

            // Ricida il nome nei cookie/memoria locale del telefono per comodità futura
            localStorage.setItem('ultimo_nome_pappa', nomeUtente);
        }

        // Funzione per annullare nel caso di errore
        window.annullaPasto = function(pastomomento) {
            if(confirm("Vuoi davvero azzerare questo pasto?")) {
                const pastoRef = ref(db, `giorni/${dataOdiernaKey}/${pastomomento}`);
                set(pastoRef, {
                    mangiato: false,
                    chi: "",
                    orario: ""
                });
            }
        }

        // Aggiorna la grafica della pagina in base ai dati del database
        function aggiornaInterfaccia(data) {
            gestisciMomento('mattina', data.mattina);
            gestisciMomento('sera', data.sera);
        }

        function gestisciMomento(momento, info) {
            const card = document.getElementById(`card-${momento}`);
            const badge = document.getElementById(`badge-${momento}`);
            const infoBox = document.getElementById(`info-${momento}`);
            const actionBox = document.getElementById(`action-${momento}`);

            // Pre-compila il nome se è già stato salvato su questo telefono
            const savedName = localStorage.getItem('ultimo_nome_pappa');
            const inputField = document.getElementById(`nome-${momento}`);
            if (savedName && inputField && !inputField.value) {
                inputField.value = savedName;
            }

            if (info && info.mangiato) {
                card.classList.add('done');
                badge.className = "status-badge done";
                badge.innerText = "Mangiato ✅";
                infoBox.innerText = `Dato da ${info.chi} alle ore ${info.orario}`;
                
                // Mostra il pulsante per eventuale correzione (annulla)
                actionBox.innerHTML = `<button class="btn-danger" onclick="annullaPasto('${momento}')">Annulla / Errore</button>`;
            } else {
                card.classList.remove('done');
                badge.className = "status-badge pending";
                badge.innerText = "Non ancora";
                infoBox.innerText = "In attesa di pappa...";
                
                actionBox.innerHTML = `
                    <div class="input-group">
                        <input type="text" id="nome-${momento}" placeholder="Tuo nome (es. Matteo)" value="${savedName || ''}">
                        <button class="btn-primary" onclick="registraPappa('${momento}')">Ha mangiato!</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
